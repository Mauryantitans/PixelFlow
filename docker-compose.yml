version: "3.9"

# PixelFlow — full local stack (PostgreSQL + backend + frontend)
# Usage:
#   docker compose up          → start everything (build on first run)
#   docker compose up --build  → rebuild images
#   docker compose down        → stop and remove containers
#   docker compose down -v     → also wipe the database volume

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pixelflow
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pixelflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:  postgresql://postgres:postgres@db:5432/pixelflow
      SECRET_KEY:    dev-secret-key-change-before-production
      DEBUG:         "True"
      USE_SQLITE:    "False"
      # ALLOWED_ORIGINS is not set → dev mode allows all localhost origins
    volumes:
      # Persist uploads and processed images across restarts
      - ./backend/uploads:/app/uploads
      - ./backend/processed:/app/processed
      # Mount source for hot-reload in dev
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  # ── React frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL:          http://localhost:8000/api
      REACT_APP_GOOGLE_CLIENT_ID: ""        # optional — leave blank to disable Google OAuth
      CHOKIDAR_USEPOLLING:        "true"    # needed for file-watch inside Docker on Mac/Windows
      WDS_SOCKET_PORT:            0         # fixes webpack HMR through Docker port mapping
    volumes:
      # Hot-reload: mount src but not node_modules
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  postgres_data:

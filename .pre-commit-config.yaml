# Pre-commit hooks. Install with: pip install pre-commit && pre-commit install
# Linting/formatting is scoped to the new, conforming code paths during the
# incremental cleanup; expand the `files:` filters as more modules are brought
# up to standard.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
        files: ^backend/(app/processing|tests)/
      - id: ruff-format
        name: ruff (format)
        files: ^backend/(app/processing|tests)/

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^frontend/src/.*\.(ts|tsx|json)$
        additional_dependencies: ["prettier@3.3.3"]
